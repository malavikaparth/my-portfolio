<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>malavika parthasarathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0e0e0e; --fg:#c8c8c8; --accent:#e05a00; --dim:#444; --dimmer:#1e1e1e; --white:#f0f0f0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:'IBM Plex Mono','Courier New',monospace; font-size:14px; line-height:1.6; min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; transition:background .3s,color .3s; }
  body::after { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px); pointer-events:none; z-index:1000; }
  nav { display:flex; justify-content:space-between; align-items:center; padding:16px 28px; border-bottom:1px solid var(--dimmer); position:fixed; top:0; left:0; right:0; background:var(--bg); z-index:50; transition:background .3s; }
  .nav-left { display:flex; gap:24px; }
  .nav-btn { color:var(--dim); font-family:inherit; font-size:13px; background:none; border:none; cursor:pointer; transition:color .15s; letter-spacing:.5px; padding:0; }
  .nav-btn:hover { color:var(--white); }
  .nav-btn.active { color:var(--accent); font-weight:500; }
  .nav-right { color:var(--accent); font-size:13px; letter-spacing:1px; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:90px 40px 80px; }
  .stage { display:flex; gap:56px; align-items:flex-start; max-width:960px; width:100%; opacity:0; transform:translateY(14px); transition:opacity .6s ease,transform .6s ease; }
  .stage.visible { opacity:1; transform:translateY(0); }
  .portrait-wrap { flex-shrink:0; display:flex; flex-direction:column; align-items:center; }
  .portrait-img {
    width: 180px;
    height: 180px;
    object-fit: cover;
    object-position: center top;
    border-radius: 4px;
    filter: grayscale(100%);
    opacity: 0.85;
    transition: opacity .3s, filter .3s;
    display: block;
  }
  .portrait-wrap:hover .portrait-img { opacity: 1; filter: grayscale(60%); }
  .name-slant { font-family:'IBM Plex Mono','Courier New',monospace; font-size:4.5px; line-height:1.25; white-space:pre; color:var(--accent); opacity:.65; margin-top:10px; user-select:none; transition:opacity .3s; }
  .portrait-wrap:hover .name-slant { opacity:1; }
  .content { flex:1; }
  .typed-block { font-size:14px; line-height:1.9; color:var(--fg); }
  .typed-block .line { display:block; min-height:1.4em; }
  .typed-block .line.bright { color:var(--white); }
  .typed-block .line.muted { color:var(--dim); }
  .cursor { display:inline-block; width:8px; height:1.1em; background:var(--accent); vertical-align:text-bottom; animation:blink 1s step-end infinite; margin-left:1px; }
  @keyframes blink { 50%{opacity:0;} }
  .panel { display:none; flex-direction:column; gap:16px; }
  .panel.active { display:flex; }
  .panel-title { font-size:10px; letter-spacing:2.5px; text-transform:uppercase; color:var(--accent); border-bottom:1px solid var(--dimmer); padding-bottom:8px; }
  .link-list { display:flex; flex-direction:column; gap:14px; }
  .link-row { display:flex; align-items:center; gap:16px; }
  .link-key { width:90px; font-size:11px; color:var(--dim); letter-spacing:1px; flex-shrink:0; }
  .link-val { color:var(--accent); text-decoration:none; font-size:13px; border-bottom:1px solid transparent; transition:border-color .2s,color .2s; }
  .link-val:hover { color:var(--white); border-bottom-color:var(--accent); }
  .link-plain { color:var(--fg); font-size:13px; }
  footer { display:flex; justify-content:space-between; align-items:center; padding:13px 28px; border-top:1px solid var(--dimmer); position:fixed; bottom:0; left:0; right:0; background:var(--bg); font-size:12px; color:var(--dim); transition:background .3s; }
  .footer-keys { display:flex; gap:26px; }
  .fkey { display:flex; align-items:center; gap:7px; }
  .fkey kbd { color:var(--accent); font-family:inherit; font-size:12px; }
  body.light { --bg:#f4f1eb; --fg:#2a2a2a; --accent:#c94800; --dim:#888; --dimmer:#d8d4cc; --white:#111; }
  body.light .portrait-img { filter: grayscale(30%); }
  @media(max-width:680px) { .stage{flex-direction:column;gap:28px;} main{padding:80px 20px 72px;} }
</style>
</head>

<script>
var LINES = [
  { text: "Malavika Parthasarathi is a Systems Engineer", cls: "bright" },
  { text: "at KBC, Leuven, Belgium", cls: "bright" },
  { text: "She received her Master's in Computer Science", cls: "" },
  { text: "from Vrije Universiteit Brussel (VUB), Belgium,", cls: "" },
  { text: "and her Bachelor's from CUSAT, India.", cls: "" },
  { text: "", cls: "spacer" },
  { text: "Driven by curiosity. Grounded in craft.", cls: "muted" }
];
var container = document.getElementById('typedAbout');
function sleep(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }
async function runTyping() {
  document.getElementById('stage').classList.add('visible');
  await sleep(600);
  for (var i = 0; i < LINES.length; i++) {
    var item = LINES[i];
    var lineEl = document.createElement('div');
    lineEl.className = 'line' + (item.cls ? ' ' + item.cls : '');
    container.appendChild(lineEl);
    if (item.cls === 'spacer' || item.text === '') { lineEl.innerHTML = '&nbsp;'; await sleep(60); continue; }
    var textNode = document.createTextNode('');
    var cur = document.createElement('span');
    cur.className = 'cursor';
    lineEl.appendChild(textNode);
    lineEl.appendChild(cur);
    for (var j = 0; j < item.text.length; j++) { textNode.textContent += item.text[j]; await sleep(20 + Math.random() * 15); }
    lineEl.removeChild(cur);
    await sleep(70);
  }
  var finalCur = document.createElement('span');
  finalCur.className = 'cursor';
  container.appendChild(finalCur);
}
var activePanel = 'about';
var PANELS = ['about', 'links'];
function showPanel(id) {
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('panel-' + id).classList.add('active');
  document.getElementById('btn-' + id).classList.add('active');
  activePanel = id;
}
document.addEventListener('keydown', function(e) {
  var idx = PANELS.indexOf(activePanel);
  if (e.key === 'ArrowRight') showPanel(PANELS[(idx+1) % PANELS.length]);
  if (e.key === 'ArrowLeft')  showPanel(PANELS[(idx-1+PANELS.length) % PANELS.length]);
  if (e.key === 't' || e.key === 'T') document.body.classList.toggle('light');
  if (e.key === 'q' || e.key === 'Q') { document.body.style.transition='opacity .4s'; document.body.style.opacity='0'; setTimeout(function(){ window.close(); },450); }
});
runTyping();
</script>
